<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migaku Local API</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e6edf4;background:#101820;color-scheme:dark}body{max-width:1080px;margin:40px auto;padding:0 24px}h1{font-size:32px;margin-bottom:8px}p{color:#a9b9c6;line-height:1.6}a{color:#8cdcc8}section{background:#19252f;border:1px solid #30414d;border-radius:12px;padding:24px;margin:24px 0}input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:7px;border:1px solid #475965;background:#101820;color:inherit}button{background:#74cdb7;color:#10231d;cursor:pointer;font-weight:600}textarea{width:100%;box-sizing:border-box;min-height:90px}label{display:block;color:#a9b9c6;margin:16px 0 6px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:11px;border-bottom:1px solid #30414d}th{color:#a9b9c6;font-weight:500}.status{color:#8cdcc8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#feedback{color:#e6c390}small{color:#a9b9c6}input[type=text]{flex:1}.auth{display:none}
</style>
<h1>Migaku Local API</h1><p>Search your vocabulary and prepare cards for Migaku Memory.</p>
<div class="row"><span id="status">Connecting…</span><a href="/docs">API documentation</a></div>
<section id="auth" class="auth"><label for="token">API token</label><div class="row"><input id="token" type="password" autocomplete="off"><button id="connect">Connect</button></div><small>The token stays in this tab’s memory.</small></section>
<section><h2>Vocabulary</h2><p id="stats">Loading vocabulary index…</p><div class="row"><input id="search" type="text" placeholder="Search a word or reading" aria-label="Search vocabulary"><select id="filter" aria-label="Learning status"><option value="">All statuses</option><option>known</option><option>learning</option><option>unknown</option><option>ignored</option><option>tracking</option></select><button id="refresh">Refresh from Migaku</button></div><table><thead><tr><th>Word</th><th>Reading</th><th>Status</th><th>Card</th></tr></thead><tbody id="words"></tbody></table><p id="results"></p></section>
<section><h2>New card</h2><div class="row"><select id="deck" aria-label="Destination deck"></select><select id="type" aria-label="Card type"></select></div><label for="word">Target word</label><input id="word" type="text" placeholder="図書館"><label for="sentence">Sentence</label><textarea id="sentence" placeholder="今日は図書館で本を読みました。"></textarea><label for="translation">Translation</label><textarea id="translation"></textarea><label for="definitions">Definitions</label><textarea id="definitions"></textarea><label for="notes">Notes</label><textarea id="notes"></textarea><p><button id="draft">Save draft</button> <button id="create">Create in Migaku</button></p><pre id="feedback" role="status"></pre></section>
<section><h2>Recent card jobs</h2><div id="jobs"></div></section>
<script>
let token='', pendingKey=null, pendingPayload=null;
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...options.headers}});if(r.status===401)$('auth').style.display='block';const data=await r.json();if(!r.ok){const error=Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));error.status=r.status;throw error}return data}
function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td)}
async function search(){const params=new URLSearchParams({q:$('search').value,status:$('filter').value});if(!params.get('status'))params.delete('status');const data=await api('/words?'+params);$('words').replaceChildren();for(const w of data.words){const tr=document.createElement('tr');cell(tr,w.headword);cell(tr,w.reading);cell(tr,w.status+(w.tracked?' · tracked':''));cell(tr,w.has_card?'Yes':'');$('words').append(tr)}$('results').textContent=`${data.total.toLocaleString()} matches · showing ${data.words.length}`;const i=data.index;$('stats').textContent=i.indexed?`${i.total.toLocaleString()} indexed words · refreshed ${new Date(i.synced_at).toLocaleString()}`:'No vocabulary snapshot yet. Sign in to the worker, then refresh.'}
async function jobs(){const data=await api('/jobs');$('jobs').replaceChildren();const labels={synced:'Synced to Migaku',created:'Created · waiting for sync',uncertain:'Needs verification',failed:'Failed',blocked:'Waiting for Migaku',queued:'Queued',running:'Creating'};for(const j of data.jobs.slice(0,10)){const p=document.createElement('p');p.textContent=`${j.payload.fields.targetWord} · ${labels[j.state]||j.state}`;$('jobs').append(p)}}
async function load(){try{const h=await api('/health');$('auth').style.display='none';$('feedback').textContent='';$('status').textContent=h.worker_running?'Migaku worker running':'Migaku worker stopped';await search();await jobs();const [d,t]=await Promise.all([api('/decks'),api('/card-types')]);for(const [id,items] of [['deck',d.decks],['type',t.card_types]]){$(id).replaceChildren();for(const item of items){const o=document.createElement('option');o.value=item.id;o.textContent=item.name;$(id).append(o)}}}catch(e){if(e.status===401){$('status').textContent='Enter your API token to connect';$('feedback').textContent=''}else $('feedback').textContent=e.message}}
function payload(){return {language:'ja',deck_id:$('deck').value?Number($('deck').value):null,card_type_id:$('type').value?Number($('type').value):null,fields:{targetWord:$('word').value,sentence:$('sentence').value,translation:$('translation').value,definitions:$('definitions').value,notes:$('notes').value}}}
async function save(submit){const p=payload();const canonical=JSON.stringify(p);if(pendingPayload!==canonical){pendingKey=crypto.randomUUID();pendingPayload=canonical}const btn=$(submit?'create':'draft');btn.disabled=true;try{const data=await api(submit?'/cards':'/drafts',{method:'POST',headers:submit?{'Idempotency-Key':pendingKey}:{},body:canonical});$('feedback').textContent=submit?`Queued job ${data.id}. Current state: ${data.state}`:`Draft saved: ${data.id}`;await jobs()}catch(e){$('feedback').textContent=e.message}finally{btn.disabled=false}}
$('draft').onclick=()=>save(false);$('create').onclick=()=>save(true);$('refresh').onclick=async()=>{try{$('refresh').disabled=true;await api('/words/refresh',{method:'POST'});await search()}catch(e){$('feedback').textContent=e.message}finally{$('refresh').disabled=false}};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>search().catch(e=>$('feedback').textContent=e.message),200)};$('filter').onchange=()=>search().catch(e=>$('feedback').textContent=e.message);$('connect').onclick=()=>{token=$('token').value;$('token').value='';load()};load();setInterval(()=>jobs().catch(()=>{}),5000);
</script></html>
